      <text x="1035" y="625" fill="#00e5ff">DE</text><text x="1495" y="625" text-anchor="end" fill="#d9e5ec">GNOME</text>
      <text x="1035" y="660" fill="#00e5ff">Theme</text><text x="1495" y="660" text-anchor="end" fill="#d9e5ec">Gerson-Dark</text>
      <text x="1035" y="695" fill="#00e5ff">Architecture</text><text x="1495" y="695" text-anchor="end" fill="#d9e5ec">x86_64</text>
