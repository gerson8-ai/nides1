    <path d="M1320 155h-62c-30 0-48 20-48 40s18 40 48 40h38v-25h-38c-12 0-20-6-20-15s8-15 20-15h62z" fill="url(#g)"/>
    <text x="1280" y="290" text-anchor="middle" font-size="32" font-weight="bold" fill="url(#g)">GERSON OS</text>
    <text x="1280" y="318" text-anchor="middle" font-size="15" fill="#00d9ff">Freedom • Privacy • Performance</text>

    <rect x="1010" y="345" width="515" height="405" rx="14" fill="#0d1b26" stroke="#1d3445"/>
    <g font-size="16">
      <text x="1035" y="380" fill="#00e5ff">OS</text><text x="1495" y="380" text-anchor="end" fill="#d9e5ec">Gerson OS 1.0</text>
