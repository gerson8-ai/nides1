      <text x="410" y="387" fill="#00e5ff">DE:</text><text x="510" y="387" fill="#e6edf3">GNOME</text>
      <text x="410" y="417" fill="#00e5ff">Theme:</text><text x="510" y="417" fill="#e6edf3">Gerson-Dark</text>
      <text x="410" y="447" fill="#00e5ff">CPU:</text><text x="510" y="447" fill="#e6edf3">x86_64 Processor</text>
      <text x="410" y="477" fill="#00e5ff">Memory:</text><text x="510" y="477" fill="#e6edf3">4820MiB / 32768MiB</text>
    </g>
    <text x="38" y="840" font-size="18" fill="#00e5ff">gerson@gerson-os:~$</text>
    <rect x="250" y="823" width="10" height="22" fill="#e6edf3"/>
  </g>

