    <text x="280" y="58" font-size="20" fill="#e6edf3">neofetch</text>

    <!-- ASCII G -->
    <text x="35" y="125" font-size="18" fill="#00e5ff" xml:space="preserve">
      <tspan x="35" dy="0">        .::::::::::::.</tspan>
      <tspan x="35" dy="19">     .::://++++++//::.</tspan>
      <tspan x="35" dy="19">   .:://++        ++//::.</tspan>
      <tspan x="35" dy="19">  :://++     GGGG    ++//:</tspan>
      <tspan x="35" dy="19"> ://++     GG        ++//:</tspan>
      <tspan x="35" dy="19">://++     GG   GGGG   ++//:</tspan>
      <tspan x="35" dy="19">++//      GG    GG     //++</tspan>
      <tspan x="35" dy="19">++//       GGGGGG      //++</tspan>
      <tspan x="35" dy="19"> ://++                 ++//:</tspan>
      <tspan x="35" dy="19">  :://++             ++//:</tspan>
      <tspan x="35" dy="19">   .:://++++++++++++//::.</tspan>
      <tspan x="35" dy="19">      .::::::::::::.</tspan>
    </text>

